version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: projmgr_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: projmgr_root
      MYSQL_DATABASE: geminitools
      MYSQL_USER: projmgr
      MYSQL_PASSWORD: projmgr_pass
    ports:
      - "3306:3306"
    volumes:
      # Mount the SQL dump — MySQL auto-imports files in /docker-entrypoint-initdb.d on first run
      - ./Dump20230122.sql:/docker-entrypoint-initdb.d/01_dump.sql:ro
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uprojmgr", "-pprojmgr_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mysql_data:
